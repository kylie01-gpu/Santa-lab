<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>엽서 인식 파일 만들기 (targets.mind)</title>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <style>
    body { margin: 0; min-height: 100vh; background: #05080d; color: #eaf8ff; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; display: flex; justify-content: center; }
    main { width: min(560px, 92vw); padding: 40px 0; display: flex; flex-direction: column; gap: 18px; }
    h1 { font-size: 22px; margin: 0; }
    p { margin: 0; line-height: 1.6; font-size: 14px; opacity: .8; }
    label.drop { border: 2px dashed rgba(143,230,255,.4); border-radius: 14px; padding: 28px; text-align: center; cursor: pointer; }
    label.drop:hover { border-color: #8fe6ff; }
    input[type=file] { display: none; }
    img { max-width: 100%; border-radius: 10px; display: none; }
    button, a.btn { appearance: none; border: 0; border-radius: 999px; padding: 14px 22px; font: 700 16px sans-serif; background: #8fe6ff; color: #05080d; cursor: pointer; text-align: center; text-decoration: none; }
    button:disabled { opacity: .4; cursor: default; }
    .bar { height: 10px; border-radius: 99px; background: rgba(143,230,255,.15); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: #8fe6ff; transition: width .2s; }
    #status { font-size: 14px; min-height: 1.4em; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>엽서 인식 파일 만들기</h1>
  <p>엽서 <b>원본 이미지</b>(인쇄하는 것과 같은 파일)를 고르고 변환하면 <b>targets.mind</b> 파일이 저장돼요.
     이 파일을 <code>assets</code> 폴더에 넣으면 끝이에요. 인터넷이 연결된 PC 크롬에서 열어 주세요.</p>

  <label class="drop" for="file">여기를 눌러 엽서 이미지 고르기 (PNG / JPG)</label>
  <input id="file" type="file" accept="image/png,image/jpeg" />
  <img id="preview" alt="선택한 엽서" />

  <button id="go" disabled>변환 시작</button>
  <div class="bar"><i id="progress"></i></div>
  <div id="status"></div>
  <a id="download" class="btn hidden" download="targets.mind">targets.mind 다시 저장하기</a>
</main>

<script type="module">
  const $ = (id) => document.getElementById(id);
  let img = null;

  $('file').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    img = new Image();
    img.onload = () => {
      $('preview').src = img.src;
      $('preview').style.display = 'block';
      $('go').disabled = false;
      $('status').textContent = `${img.naturalWidth} × ${img.naturalHeight} px 이미지를 불러왔어요.`;
    };
    img.src = URL.createObjectURL(f);
  });

  async function loadCompiler() {
    const mod = await import('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js');
    const C = mod.Compiler || (window.MINDAR && window.MINDAR.IMAGE && window.MINDAR.IMAGE.Compiler);
    if (!C) throw new Error('Compiler not found');
    return C;
  }

  $('go').addEventListener('click', async () => {
    if (!img) return;
    $('go').disabled = true;
    $('download').classList.add('hidden');
    $('status').textContent = '변환 도구를 불러오는 중…';
    try {
      const Compiler = await loadCompiler();
      const compiler = new Compiler();
      $('status').textContent = '변환 중… (1~2분 걸릴 수 있어요)';
      await compiler.compileImageTargets([img], (p) => {
        $('progress').style.width = Math.min(100, p).toFixed(0) + '%';
      });
      const data = await compiler.exportData();
      const blob = new Blob([data]);
      const url = URL.createObjectURL(blob);
      const a = $('download');
      a.href = url;
      a.classList.remove('hidden');
      a.click();
      $('progress').style.width = '100%';
      $('status').textContent = '완료! targets.mind 파일이 다운로드 폴더에 저장됐어요.';
    } catch (err) {
      console.error(err);
      $('status').textContent = '변환에 실패했어요. 인터넷 연결을 확인하고 크롬에서 다시 시도해 주세요. (' + (err.message || err) + ')';
    } finally {
      $('go').disabled = false;
    }
  });
</script>
</body>
</html>
